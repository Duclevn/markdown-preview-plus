name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: linux
            os: ubuntu-24.04
            bundles: deb
            artifact-path: src-tauri/target/release/bundle/deb/*.deb
          - platform: macos
            os: macos-latest
            bundles: app,dmg
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - run: npm run check

      - run: npm test

      - name: Run native policy tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build native bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/Markdown Preview Plus.app" \
            "src-tauri/target/release/bundle/macos/Markdown Preview Plus.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-preview-plus-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
